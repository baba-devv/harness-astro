[project]
name = "harness"
version = "0.1.0"
description = "Conversational AI agent with graph-backed user data and memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.15.0",
    "fastapi>=0.147.0",
    "google-genai>=2.31.0",
    "neo4j>=6.4.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Live tests call real LLMs; run them explicitly with: uv run pytest -m live
markers = ["live: end-to-end tests against the configured LLM provider, Neo4j and SQLite"]
addopts = "-m 'not live'"
